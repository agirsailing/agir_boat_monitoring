      <section id="map-page" aria-label="Boat map" hidden>
        <div class="map-toolbar">
          <p id="map-status" class="muted" role="status">Waiting for a GPS fix · Stockholm</p>
          <button id="follow-boat" class="button secondary" type="button" aria-pressed="true">Follow boat: on</button>
        </div>
        <p id="map-error" class="error" role="alert" hidden></p>
        <div id="boat-map" aria-label="Live boat position map"></div>
        <p class="muted map-note">The arrow follows absolute GPS coordinates. Its direction is estimated from GPS movement; it is not a compass heading.</p>
      </section>
